[project]
name = "yeongi-root"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "yeongi-core",
    "yeongi-storage",
]

[dependency-groups]
dev = [
    "commitizen>=4.13.9",
    "poethepoet>=0.42.1",
    "pre-commit>=4.5.1",
    "pydantic>=2.12.5",
    "pytest>=9.0.2",
    "ruff>=0.15.5",
]

[tool.poe.tasks]
test = "pytest"
lint = "ruff check ."
commit = "cz commit"
tofu-init = { shell = "cd infrastructure/tofu && tofu init" }
tofu-plan = { shell = "cd infrastructure/tofu && tofu plan" }
tofu-apply = { shell = "cd infrastructure/tofu && tofu apply" }

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "pep621"
update_map_description = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D100", "D101", "D102", "D103", "D104",  # Missing docstrings
    "D203", "D213",                          # Incompatible docstring rules
    "INP001",                                # Implicit namespace packages
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.uv.workspace]
members = [
    "apps/telegram-echo",
    "libs/adapters",
    "libs/core",
    "libs/storage",
]
